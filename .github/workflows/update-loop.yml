name: Keep AltStore sources updated

on:
  workflow_dispatch:

concurrency:
  group: playtorrio-updater-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    environment: updater-delay
    runs-on: ubuntu-latest
    steps:
      - name: Create updater App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            playtorrio-altstore
            nuvio-altstore
          permission-actions: write

      - name: Queue next delayed check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run update-loop.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run PlayTorrio updater
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run source-updater.yml --repo "$GITHUB_REPOSITORY" --ref main -f force_deploy=false

      - name: Run Nuvio updater
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run source-updater.yml --repo "${{ github.repository_owner }}/nuvio-altstore" --ref main -f force_deploy=false
